[package]
name = "rdf-term"
description = "Data-structures and traits definitions for RDF."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
categories.workspace = true

[features]
default = []
serde = ["dep:serde", "iri-rs/serde", "langtag/serde"]
uuid-generator = ["uuid-generator-v3", "uuid-generator-v4", "uuid-generator-v5"]
uuid-generator-v3 = ["uuid", "uuid/v3"]
uuid-generator-v4 = ["uuid", "uuid/v4"]
uuid-generator-v5 = ["uuid", "uuid/v5"]

[dependencies]
contextual = { version = "0.1.6", optional = true }
educe = "0.6.0"
equivalent = "1.0.2"
indexmap = "2.14.0"
iri-rs = { version = "3.3.1", features = ["static"] }
iri-rs-core = "3.3.1"
itoa = "1.0.18"
langtag = "1.1.0"
raw-btree = "0.3.3"
replace_with = "0.1.8"
serde = { version = "1.0.228", features = ["derive"], optional = true }
slab = "0.4.12"
thiserror = "2.0.18"
uuid = { version = "1.23.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"

[[bench]]
name = "dataset"
harness = false

[[bench]]
name = "isomorphism"
harness = false
