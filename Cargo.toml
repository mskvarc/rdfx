[package]
name = "rdf-rs"
description = "RDF data-structures, traits and utilities: terms, triples, quads, interpretations, graphs and datasets."
version = "0.23.0"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/rdf-rs/"
categories = ["data-structures", "web-programming", "encoding"]
keywords = ["rdf", "graph", "dataset", "triple", "semantic-web"]

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
get_unwrap = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
used_underscore_binding = "warn"
missing_const_for_fn = "warn"
branches_sharing_code = "warn"
cloned_instead_of_copied = "warn"
unnecessary_self_imports = "warn"
redundant_clone = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"

[features]
default = []
serde = ["dep:serde", "iri-rs/serde", "langtag/serde"]
meta = ["dep:locspan"]
uuid-generator = ["uuid-generator-v3", "uuid-generator-v4", "uuid-generator-v5"]
uuid-generator-v3 = ["uuid", "uuid/v3"]
uuid-generator-v4 = ["uuid", "uuid/v4"]
uuid-generator-v5 = ["uuid", "uuid/v5"]

[dependencies]
contextual = { version = "0.1.6", optional = true }
educe = "0.6.0"
equivalent = "1.0.2"
hashbrown = "0.17.0"
indexmap = "2.14.0"
iri-rs = { version = "3.3.1", features = ["static"] }
iri-rs-core = "3.3.1"
itoa = "1.0.18"
langtag = "1.1.0"
locspan = { version = "0.9.2", optional = true }
memchr = "2.8.0"
raw-btree = "0.3.3"
replace_with = "0.1.8"
serde = { version = "1.0.228", features = ["derive"], optional = true }
slab = "0.4.12"
thiserror = "2.0.18"
uuid = { version = "1.23.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
iri-rs = { version = "3.3.1", features = ["static"] }
rand = "0.10.1"

[[bench]]
name = "dataset"
harness = false

[[bench]]
name = "isomorphism"
harness = false

[[bench]]
name = "swar"
harness = false
