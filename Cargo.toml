[package]
name = "rdfx"
description = "RDF 1.2 data-structures, traits and utilities: terms (incl. triple terms), triples, quads, interpretations, graphs, datasets, unstar/restar reification helpers."
version = "0.23.2"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/rdfx/"
categories = ["data-structures", "web-programming", "encoding"]
keywords = ["rdf", "graph", "dataset", "triple", "semantic-web"]
autobenches = false
# The generated isomorphism suites are 2.3 MiB each and only serve local
# regression testing.
exclude = ["tests/iso_btree.rs", "tests/iso_hash.rs"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde", "iri-rs/serde", "langtag/serde"]
meta = ["dep:locspan"]
uuid-generator = ["uuid-generator-v3", "uuid-generator-v4", "uuid-generator-v5"]
uuid-generator-v3 = ["uuid", "uuid/v3"]
uuid-generator-v4 = ["uuid", "uuid/v4"]
uuid-generator-v5 = ["uuid", "uuid/v5"]

[dependencies]
contextual = { version = "0.1.6", optional = true }
educe = "0.6.0"
equivalent = "1.0.2"
hashbrown = "0.17.0"
indexmap = "2.14.0"
iri-rs = { version = "3.3.2", features = ["static"] }
itoa = "1.0.18"
langtag = "1.1.0"
locspan = { version = "0.9.2", optional = true }
memchr = "2.8.0"
raw-btree = "0.3.3"
replace_with = "0.1.8"
serde = { version = "1.0.228", features = ["derive", "rc"], optional = true }
slab = "0.4.12"
thiserror = "2.0.18"
uuid = { version = "1.23.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.1"
serde_json = "1.0.149"
trybuild = "1.0.116"

[[bench]]
name = "dataset"
harness = false

[[bench]]
name = "isomorphism"
harness = false

[[bench]]
name = "swar"
harness = false

[[bench]]
name = "triple_terms"
harness = false

[[bench]]
name = "vocabulary"
harness = false
